async function api(p,o={}){const r=await fetch(URL_+p,{...o,headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',Prefer:'return=representation',...(o.headers||{})}});if(!r.ok)throw new Error(p.split('?')[0]+': '+(await r.text()));return r.json()}

const DF=new Intl.DateTimeFormat('en-CA',{timeZone:TZ}),DT=new Intl.DateTimeFormat('ar-EG',{timeZone:TZ,dateStyle:'medium',timeStyle:'short'}),DD=new Intl.DateTimeFormat('ar-EG',{timeZone:'UTC',dateStyle:'medium'}),DW=new Intl.DateTimeFormat('ar-EG',{timeZone:'UTC',weekday:'long',day:'numeric',month:'short'});

async function load(){
 D.ready=false;D.dept=null;
 $('#dt').textContent=new Date().toLocaleDateString('ar-EG',{timeZone:TZ,dateStyle:'full'});$('#err').innerHTML='';

  [D.users,D.tickets,D.sol,D.rat,D.msgs,D.reads,D.reps]=await Promise.all([

 render()}
/* ===== تجهيز البيانات مرة واحدة: فهارس + تواريخ محسوبة مسبقاً ===== */
function prep(){
 TD=dk(new Date());
 D.um=new Map(D.users.map(u=>[u.id,u]));D.tm=new Map(D.tickets.map(t=>[t.id,t]));D.rm=new Map(D.rat.map(r=>[r.ticket_id,r]));
 D.tkd={};D.sod={};D.st=new Map();D.dept=null;
 D.tickets.forEach(t=>{t._c=P(t.created_at).getTime();t._d=dk(t._c);t._u=t.updated_at?P(t.updated_at).getTime():t._c;t._o=!DONE.includes(t.status);D.tkd[t._d]=(D.tkd[t._d]||0)+1});
 D.sol.forEach(s=>{s._c=P(s.created_at).getTime();s._d=dk(s._c);D.sod[s._d]=(D.sod[s._d]||0)+1});
 const push=(m,k,v)=>{if(k==null)return;let a=m.get(k);if(!a)m.set(k,a=[]);a.push(v)};
 D.by={a:new Map(),c:new Map(),s:new Map()};
 D.tickets.forEach(t=>{push(D.by.a,t.assigned_to,t);push(D.by.c,t.created_by,t)});
 D.sol.forEach(s=>push(D.by.s,s.engineer_id,s));
 /* التذاكر المكتملة والمحلولة لكل موظف: رقم التذكرة -> يوم الإنجاز */

 D.by.s.forEach((arr,id)=>{const m=new Map();arr.forEach(s=>{const o=m.get(s.ticket_id);if(o==null||s._d>o)m.set(s.ticket_id,s._d)});D.done.set(id,m)});

 const hs=D.sol.map(s=>{const t=D.tm.get(s.ticket_id);return t?(s._c-t._c)/36e5:null}).filter(x=>x!=null&&x>=0).sort((a,b)=>a-b);
 D.med=hs.length?hs[Math.floor(hs.length/2)]:null;
 D.maxSol=Math.max(10,...[...D.by.s.values()].map(a=>a.length));
 D.users.forEach(u=>u._n=nz(u.name+' '+(u.username||'')+' '+(u.job_title||'')));

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');tab=b.dataset.t;curRole=null;render()});

/* ===== رسوم ===== */
const days=n=>[...Array(n)].map((_,i)=>dk(new Date(Date.now()-(n-1-i)*864e5)));
function bars(ser,n=14){const ds=days(n),all=ser.map(s=>ds.map(d=>s.f(d))),mx=Math.max(1,...all.flat());
 return '<div class="ch">'+ds.map((d,i)=>`<div title="${d}"><div class="bs">${ser.map((s,j)=>`<i title="${s.n}: ${all[j][i]}" style="height:${all[j][i]/mx*100}%;background:${s.c}"></i>`).join('')}</div><small>${+d.slice(8)}</small></div>`).join('')+'</div><div class="fl" style="gap:14px">'+ser.map(s=>`<span class="lg"><i style="background:${s.c}"></i>${s.n}</span>`).join('')+'</div>'}
function hbars(a,fmt=v=>v,mx0){const mx=mx0||Math.max(1,...a.map(x=>x.v));return a.length?a.map(x=>`<div class="hb"><span>${esc(x.l)}</span> <b style="float:left">${x.t||fmt(x.v)}</b><div><i style="width:${Math.min(100,x.v/mx*100)}%;background:${x.c||'linear-gradient(90deg,var(--pri),#13a4b0)'}"></i></div></div>`).join(''):'<span class="mut">لا بيانات بعد</span>'}
function donut(items){const t=items.reduce((a,x)=>a+x.v,0);let acc=0;const g=items.map((x,i)=>{const s=acc/(t||1)*100;acc+=x.v;return `${COLS[i%6]} ${s}% ${acc/(t||1)*100}%`}).join(',');

 const roles=[...new Set([...Object.keys(ROLE_AR),...D.users.map(u=>u.role).filter(Boolean)])];

 let h=`<div class="bar"><button class="btn" onclick="newMsg()">رسالة جديدة</button>${P_.map(([k,l])=>`<button class="chip ${M.p===k?'on':''}" onclick="M.p='${k}';rMsgs()">${l}</button>`).join('')}
 ${M.p==='custom'?`من <input type="date" class="sm" value="${M.from}" onchange="M.from=this.value;rMsgs()"> إلى <input type="date" class="sm" value="${M.to}" onchange="M.to=this.value;rMsgs()">`:''}
 <select class="sm" onchange="M.role=this.value;rMsgs()"><option value="">كل الإدارات</option>${roles.filter(r=>!HIDE.includes(r)).map(r=>`<option value="${esc(r)}" ${M.role===r?'selected':''}>${esc(rl(r))}</option>`).join('')}</select><span class="mut">${list.length} رسالة</span></div>`;
 const gr={};list.forEach(m=>(gr[dayKey(m.created_at)]??=[]).push(m));
 h+=Object.keys(gr).sort().reverse().map(k=>`<div class="dayh">${new Date(k+'T12:00:00').toLocaleDateString('ar-EG',{dateStyle:'full'})} <span class="pill">${gr[k].length}</span></div>`+gr[k].map(m=>{const rc=recips(m).length,rd=D.reads.filter(x=>x.message_id===m.id).length,rp=D.reps.filter(x=>x.message_id===m.id).length;
  return `<div class="msg"><div class="mrow" onclick="msgView(${m.id})"><div><b>${esc(m.subject)}</b><div class="mut">إلى: ${m.target_roles.includes('all')?'كل الإدارات':m.target_roles.map(rl).join('، ')} • ${fd(m.created_at)}</div></div><div class="hb" style="margin:0"><span class="mut">قراءة ${rd}/${rc}</span><div><i style="width:${rc?rd/rc*100:0}%;background:var(--ok)"></i></div></div><span class="pill b">${rp} رد</span></div></div>`}).join('')).join('')||'<p class="mut">لا توجد رسائل في هذه الفترة.</p>';
 $('#v').innerHTML=h}
function newMsg(){const roles=[...new Set([...Object.keys(ROLE_AR),...D.users.map(u=>u.role).filter(Boolean)])].filter(r=>!HIDE.includes(r));
 openOv(`<button class="btn l" onclick="closeOv()">إغلاق</button><h2>رسالة جديدة</h2><input id="ms" placeholder="عنوان الرسالة"><br><br><textarea id="mb" placeholder="نص الرسالة"></textarea><div style="margin:12px 0"><label class="ck"><input type="checkbox" id="mall"> كل الإدارات</label>${roles.map(r=>`<label class="ck"><input type="checkbox" class="mr" value="${esc(r)}"> ${esc(rl(r))}</label>`).join('')}</div><button class="btn" onclick="sendMsg()">إرسال</button>`)}
async function sendMsg(){const tr=$('#mall').checked?['all']:[...document.querySelectorAll('.mr:checked')].map(x=>x.value);
 if(!$('#ms').value.trim()||!$('#mb').value.trim()||!tr.length)return alert('اكتب العنوان والنص واختر إدارة واحدة على الأقل');
 try{await api('messages',{method:'POST',body:JSON.stringify({subject:$('#ms').value.trim(),body:$('#mb').value.trim(),sender_name:SENDER,target_roles:tr})});closeOv();M.p='today';await load()}catch(e){alert(e.message)}}
function msgView(id){const m=D.msgs.find(x=>x.id===id),rc=recips(m),rd=D.reads.filter(x=>x.message_id===id),rp=D.reps.filter(x=>x.message_id===id);
 openOv(`<button class="btn l" onclick="closeOv()">إغلاق</button><h2>${esc(m.subject)}</h2><div class="box" style="white-space:pre-wrap">${esc(m.body)}</div>
 <div class="box"><h4>حالة القراءة (${rd.length}/${rc.length})</h4>${rc.map(u=>{const r=rd.find(x=>x.user_id===u.id);return `<div class="tk">${esc(u.name)} <span class="mut">${esc(rl(u.role))}</span> <span class="pill ${r?'g':'r'}">${r?'قرأها '+fd(r.read_at):'لم تُقرأ'}</span></div>`}).join('')}</div>
 <div class="box"><h4>الردود (${rp.length})</h4>${rp.map(r=>`<div class="rep"><b>${esc(r.user_name)}</b> <span class="mut">${fd(r.created_at)}</span><br>${esc(r.body)}</div>`).join('')||'<span class="mut">لا توجد ردود</span>'}<br><textarea id="rb" placeholder="اكتب رداً"></textarea><br><br><button class="btn" onclick="reply(${id})">إرسال الرد</button></div>`)}
async function reply(id){const b=$('#rb').value.trim();if(!b)return;try{await api('message_replies',{method:'POST',body:JSON.stringify({message_id:id,user_name:SENDER,body:b})});await load();msgView(id)}catch(e){alert(e.message)}}
function openOv(h){$('#pn').innerHTML=h;$('#ov').classList.add('show')}function closeOv(){$('#ov').classList.remove('show')}
load();


// منع القائمة المنسدلة عند الضغط بزر الفأرة الأيمن
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });

    // منع اختصارات لوحة المفاتيح الخاصة بأدوات المطور
    document.addEventListener('keydown', function(e) {
        // منع F12
        if (e.key === "F12") {
            e.preventDefault();
        }
        // منع Ctrl+Shift+I / Ctrl+Shift+J / Ctrl+Shift+C
        if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) {
            e.preventDefault();
        }
        // منع Ctrl+U (عرض مصدر الصفحة)
        if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) {
            e.preventDefault();
        }
    });
    setInterval(function() {
        const startTime = performance.now();
        debugger; // يوقف تنفيذ الكود إذا كانت أدوات المطور مفتوحة
        const endTime = performance.now();
        if (endTime - startTime > 100) {
            // إذا اكتشف فتح F12، يتم توجيه المستخدم أو إعادة تحميل الصفحة
            window.location.reload();
        }
    }, 1000);
</script></body></html>
