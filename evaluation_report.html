<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تقرير التقييمات وسرعة الحل</title>

<link rel="stylesheet" href="evaluation_report.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

</head>
<body>

<div class="page">
<!-- =======================================================
====================== HEADER START =======================
======================================================= -->
<header class="main-header">

    <!-- اللوجو على اليمين -->
    <img src="photo/logo.png" class="logo" alt="Logo">

    <!-- العنوان في المنتصف -->
    <div class="brand-container">
        <h1 class="brand-title">EL saleheya EL Gadida Universty</h1>
        <p class="brand-subtitle">Ticketing system</p>
    </div>

    <!-- زر تسجيل الخروج على اليسار -->
    <button class="about-link" id="logoutBtn" onclick="logou()">عودة </button>

</header>
<script>
    function logou() {

    sessionStorage.clear();

    window.location.replace("admin_dashboard.html");

}
</script>
<!-- =======================================================
======================= HEADER END ========================
======================================================= -->
    <!-- عنوان الصفحة -->
    <div class="page-header">

        <h1>
            تقرير التقييمات ومدى سرعة الحل
        </h1>

        <p>
            متابعة أداء مهندسي الدعم الفني وسرعة معالجة التذاكر
        </p>

    </div>

    <!-- الفلاتر -->

    <div class="filter-box">

        <div class="filter-grid">

            <div class="field">

                <label>

                    من تاريخ

                </label>

                <input
                    type="date"
                    id="fromDate">

            </div>

            <div class="field">

                <label>

                    إلى تاريخ

                </label>

                <input
                    type="date"
                    id="toDate">

            </div>

            <div class="field">

                <label>

                    المهندس

                </label>

                <select id="engineerFilter">

                    <option value="">
                        جميع المهندسين
                    </option>

                </select>

            </div>

            <div class="field">

                <label>

                    الموظف

                </label>

                <select id="employeeFilter">

                    <option value="">
                        جميع الموظفين
                    </option>

                </select>

            </div>

            <div class="field">

                <label>

                    الكلية

                </label>

                <select id="facultyFilter">

                    <option value="">
                        جميع الكليات
                    </option>

                    <option value="pharmacy">
                     كلية الصيدلة
                    </option>

                    <option value="physical_therapy">
                          كلية العلاج الطبيعي
                    </option>

                    <option value="dentistry">
                        كلية أسنان
                    </option>

                    <option value="computer_science">
                        كلية الحاسبات والمعلومات
                    </option>

                    <option value="management">
                        كلية إدارة
                    </option>

                </select>

            </div>

        </div>

        <div class="button-group">

            <button
                class="btn btn-primary"
                onclick="viewReport()">

                عرض التقرير

            </button>

            <button
                class="btn btn-success"
                onclick="generateExcel()">

                تصدير Excel

            </button>

            <button
                class="btn btn-danger"
                onclick="generatePDF()">

                تصدير PDF

            </button>

        </div>

    </div>

    <!-- مكان ظهور التقرير -->

    <div
        id="reportView"
        class="report-container">

        <div class="empty">

            <div class="empty-icon">

                📊

            </div>

            <h2>

                لا يوجد تقرير حالياً

            </h2>

            <p>

                قم باختيار الفلاتر المطلوبة ثم اضغط
                <strong>عرض التقرير</strong>

            </p>

        </div>

    </div>

</div>

<script src="evaluation_report.js"></script>

</body>

</html>
